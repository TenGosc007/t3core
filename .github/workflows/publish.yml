name: Publish to npm

on:
  release:
    types: [published]

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js and Yarn
        uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Check release tag and select npm dist-tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./package.json');
          const expectedTag = `v${version}`;

          if (process.env.RELEASE_TAG !== expectedTag) {
            console.error(`::error::Release tag ${process.env.RELEASE_TAG} does not match package.json version ${expectedTag}`);
            process.exit(1);
          }

          const distTag = version.includes('-') ? 'next' : 'latest';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist-tag=${distTag}\n`);
          console.log(`Validated ${expectedTag}; npm dist-tag: ${distTag}`);
          NODE

      # Trusted publishing requires npm >= 11.5.1 and Node.js >= 22.14.0.
      - name: Setup npm for trusted publishing
        run: npm install --global npm@11

      - name: Check whether version is already published
        id: check
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const { name, version } = require('./package.json');
          const spec = `${name}@${version}`;
          const result = spawnSync('npm', ['view', spec, 'version', '--json'], {
            encoding: 'utf8',
          });

          if (result.error) throw result.error;

          let response;
          try {
            response = JSON.parse(result.stdout);
          } catch {
            throw new Error(`Cannot read npm registry response for ${spec}: ${result.stderr}`);
          }

          if (result.status === 0 && response === version) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n');
            console.log(`::notice::${spec} is already on npm. Nothing to publish.`);
          } else if (result.status !== 0 && response.error?.code === 'E404') {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n');
            console.log(`${spec} is not published yet.`);
          } else {
            throw new Error(`Cannot check npm version for ${spec}: ${result.stderr || JSON.stringify(response)}`);
          }
          NODE

      - name: Install dependencies
        if: steps.check.outputs.published != 'true'
        run: yarn install --frozen-lockfile

      - name: Lint
        if: steps.check.outputs.published != 'true'
        run: yarn lint

      - name: TypeScript check
        if: steps.check.outputs.published != 'true'
        run: yarn ts:check

      - name: Run tests
        if: steps.check.outputs.published != 'true'
        run: yarn test --run

      - name: Build and check packed package
        if: steps.check.outputs.published != 'true'
        run: yarn package:check

      - name: Publish
        if: steps.check.outputs.published != 'true'
        run: npm publish --provenance --access public --ignore-scripts --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
